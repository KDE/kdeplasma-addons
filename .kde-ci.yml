Dependencies:
 - 'on': ['@all']
   'require':
    'frameworks/attica': 'Frameworks/6.24'
    'frameworks/extra-cmake-modules': 'Frameworks/6.24'
    'frameworks/kauth': 'Frameworks/6.24'
    'frameworks/kcmutils': 'Frameworks/6.24'
    'frameworks/kcodecs': 'Frameworks/6.24'
    'frameworks/kcompletion': 'Frameworks/6.24'
    'frameworks/kconfig': 'Frameworks/6.24'
    'frameworks/kconfigwidgets': 'Frameworks/6.24'
    'frameworks/kcoreaddons': 'Frameworks/6.24'
    'frameworks/kglobalaccel': 'Frameworks/6.24'
    'frameworks/kholidays': 'Frameworks/6.24'
    'frameworks/ki18n': 'Frameworks/6.24'
    'frameworks/kio': 'Frameworks/6.24'
    'frameworks/kjobwidgets': 'Frameworks/6.24'
    'frameworks/knewstuff': 'Frameworks/6.24'
    'frameworks/knotifications': 'Frameworks/6.24'
    'frameworks/kpackage': 'Frameworks/6.24'
    'frameworks/krunner': 'Frameworks/6.24'
    'frameworks/kservice': 'Frameworks/6.24'
    'frameworks/kwidgetsaddons': 'Frameworks/6.24'
    'frameworks/kxmlgui': 'Frameworks/6.24'
    'frameworks/solid': 'Frameworks/6.24'
    'frameworks/sonnet': 'Frameworks/6.24'
    'frameworks/kunitconversion': 'Frameworks/6.24'
    'libraries/kirigami-addons': 'v1.11.0'
    'plasma/libplasma': '@same'
    'plasma/plasma-workspace': '@same'
 - 'on': ['Linux']
   'require':
    'sdk/selenium-webdriver-at-spi': '@same'

RuntimeDependencies:
 - 'on': ['Linux']
   'require':
    'plasma/plasma-desktop': '@same'
    'plasma/plasma-nano': '@same' # For appium tests

Options:
 require-passing-tests-on: ['Linux', 'FreeBSD']
 cppcheck-ignore-files: ['templates/']
 run-qmllint: true
